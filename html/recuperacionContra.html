<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperación de contraseña - ACME</title>
  <link href="/css/recuperacionContra.css" rel="stylesheet">
  <link href="/css/acme-system.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/imgs/BancoLogo.png">
</head>
<body>
  <main class="container"><div class="logo"><div><span>banco</span><br><span class="acme">ACME</span></div><img src="/imgs/BancoLogo.png" alt="Logo de Banco ACME" class="bancologo"></div>
    <h1>Recuperación de contraseña</h1><div class="form-box"><form id="recuperarForm" novalidate>
      <p class="label" id="recoveryHelp">Introduce el correo asociado a tu cuenta.</p>
      <div class="input-group"><label class="sr-only" for="correo">Correo electrónico</label><input type="email" id="correo" autocomplete="email" placeholder="Correo electrónico" required aria-describedby="recoveryHelp formMessage"></div>
      <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
      <button type="submit">Enviar enlace</button>
      <div class="extras"><p class="forgot"><a href="/html/login.html">Volver</a></p></div>
    </form></div>
  </main>
  <script type="module" src="/js/recuperacionContra.js"></script>
</body>
</html>
