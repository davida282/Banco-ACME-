<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña - ACME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="/css/nuevaContra.css" rel="stylesheet">
  <link href="/css/acme-system.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="/imgs/banco-acme-favicon.png">
</head>
<body>
  <main class="container">
    <div class="logo"><div><span>banco</span><br><span class="acme">ACME</span></div><img src="/imgs/banco-acme-logo.png" alt="Logo de Banco ACME" class="bancologo"></div>
    <h1>Nueva contraseña</h1>
    <div class="form-box">
      <form id="recuperarForm" novalidate>
        <div class="input-group"><label for="contrasena">Nueva contraseña</label><input type="password" id="contrasena" autocomplete="new-password" minlength="8" required aria-describedby="passwordHelp formMessage"></div>
        <p id="passwordHelp" class="label">Usa mínimo 8 caracteres.</p>
        <div class="input-group"><label for="confirmarContra">Confirmar contraseña</label><input type="password" id="confirmarContra" autocomplete="new-password" minlength="8" required aria-describedby="formMessage"></div>
        <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
        <button type="submit">Cambiar contraseña</button>
      </form>
    </div>
  </main>
  <script type="module" src="/js/nuevaContra.js"></script>
</body>
</html>
